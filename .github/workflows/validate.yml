name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar perfiles e índice
        run: python tools/build_index.py --check
